<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Nuestras 100 Citas 💖</title>
    
    <!-- Bootstrap CSS y FontAwesome -->
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/css/bootstrap.min.css" rel="stylesheet">
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
    
    <!-- Tus estilos (Asegúrate de que la ruta coincida) -->
    <link rel="stylesheet" href="css/flappy.css">
    
    <style>
        body {
            background-color: #ffeef4;
            font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
            padding-bottom: 40px;
        }

        .citas-container {
            max-width: 650px;
            margin: 0 auto;
            padding: 20px 15px;
        }

        .citas-header {
            background: white;
            border-radius: 20px;
            padding: 20px;
            text-align: center;
            box-shadow: 0 4px 15px rgba(255, 142, 187, 0.2);
            border: 2px solid #ffe3ec;
            margin-bottom: 25px;
        }

        .citas-header h1 {
            color: #2a1e24;
            font-weight: 700;
            font-size: 1.8rem;
            margin-bottom: 5px;
        }

        .citas-badge {
            background: #ff8ebb;
            color: white;
            font-weight: 600;
            padding: 6px 16px;
            border-radius: 20px;
            display: inline-block;
            font-size: 0.95rem;
        }

        .cita-item {
            display: flex;
            align-items: center;
            padding: 14px 18px;
            margin-bottom: 10px;
            background: #ffffff;
            border: 2px solid #ffe3ec;
            border-radius: 14px;
            transition: all 0.2s ease;
            cursor: pointer;
            box-shadow: 0 2px 5px rgba(0,0,0,0.02);
        }

        .cita-item:hover {
            border-color: #ff8ebb;
            transform: translateY(-2px);
            box-shadow: 0 4px 10px rgba(255, 142, 187, 0.15);
        }

        .cita-item.completada {
            background: #ffeef4;
            border-color: #ffb6c1;
            opacity: 0.8;
        }

        .cita-item.completada .cita-texto {
            text-decoration: line-through;
            color: #888;
        }

        .cita-item input[type="checkbox"] {
            width: 22px;
            height: 22px;
            margin-right: 15px;
            accent-color: #ff4a85;
            cursor: pointer;
        }

        .cita-texto {
            font-size: 1rem;
            color: #2a1e24;
            font-weight: 600;
        }

        .btn-volver {
            background: #2a1e24;
            color: white;
            border-radius: 12px;
            text-decoration: none;
            padding: 8px 16px;
            display: inline-flex;
            align-items: center;
            gap: 8px;
            font-weight: 500;
            margin-bottom: 15px;
            transition: transform 0.2s;
        }

        .btn-volver:hover {
            color: white;
            transform: scale(1.03);
        }
    </style>
</head>
<body>

    <div class="citas-container">
        <!-- Botón para regresar al inicio -->
        <a href="index.html" class="btn-volver">
            <i class="fa-solid fa-arrow-left"></i> Volver al Inicio
        </a>

        <!-- Cabecera con Contador -->
        <div class="citas-header">
            <h1>Nuestras 100 Citas 💖</h1>
            <p class="text-muted mb-2">Un Check por cada aventura juntos</p>
            <div class="citas-badge" id="citasContador">Completadas: 0 / 100</div>
        </div>

        <!-- Lista donde se cargan las citas -->
        <div id="listaCitas"></div>
    </div>

    <!-- Script con la lógica de las 100 citas -->
    <script src="js/citas.js"></script>
</body>
</html>
